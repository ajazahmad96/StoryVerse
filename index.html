<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#100E16">
<title>StoryVerse — Enter a World</title>
<meta name="description" content="StoryVerse — step into interactive worlds where characters have their own personalities, memories and lives.">
<meta name="application-name" content="StoryVerse">
<meta name="apple-mobile-web-app-title" content="StoryVerse">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:title" content="StoryVerse — Enter a World">
<meta property="og:site_name" content="StoryVerse">
<meta property="og:description" content="Interactive story worlds with characters who remember, react and live their own lives.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400&family=Bebas+Neue&family=Special+Elite&family=Cinzel:wght@500;700&family=Space+Grotesk:wght@500;700&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Serif+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#100E16; --s1:#181521; --s2:#221E2D; --s3:#2D283A;
  --line:rgba(239,231,218,.10); --ink:#EFE7DA; --dim:#A39BAD; --faint:#756D80;
  --ember:#E3A46B; --accent:var(--ember); --on-accent:#17110a;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --tab-h:62px; --chat-fs:1.02rem;
  --f-ui:'Figtree','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-serif:'Fraunces','Noto Serif Devanagari',Georgia,'Times New Roman',serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none;display:block}
#app{position:fixed;top:0;left:0;right:0;height:100dvh;max-width:560px;margin:0 auto;overflow:hidden;background:var(--bg);box-shadow:0 0 0 1px var(--line)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg);min-height:0}
.screen.on{display:flex}
.tab.on{animation:fadeIn .28s var(--ease)}
.stack{z-index:30}
.stack.on{animation:slideIn .34s var(--ease)}
.stack.leaving{animation:slideOut .24s ease-in forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}}
@keyframes slideIn{from{transform:translateX(24px);opacity:0}}
@keyframes slideOut{to{transform:translateX(24px);opacity:0}}
.rm *,.rm *::before,.rm *::after{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.001s!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.tabpad{padding:calc(var(--sat) + 14px) 20px calc(var(--tab-h) + var(--sab) + 28px)}

/* buttons / chips */
.btn{min-height:50px;padding:0 22px;border-radius:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--s2);border:1px solid var(--line)}
.btn.danger{background:#5b2430;border:1px solid #8a3a49}
.btn[disabled]{opacity:.4;pointer-events:none}
.grow{flex:1}
.icbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--ink)}
.icbtn:active{background:var(--s2)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{min-height:38px;padding:0 15px;border-radius:999px;background:var(--s2);border:1px solid var(--line);color:var(--dim);font-size:.88rem;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.chip.on{background:var(--ink);color:#17110a;border-color:transparent;font-weight:700}
.gen{display:inline-block;max-width:100%;padding:3px 10px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:.74rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h1,h2,h3{font-weight:700;line-height:1.15}
.sec{font-family:var(--f-serif);font-size:1.15rem;font-weight:600;margin:28px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec small{font-family:var(--f-ui);font-size:.8rem;color:var(--dim);font-weight:500}
.muted{color:var(--dim)}

/* top / home */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{font-family:var(--f-serif);font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
.brand i{font-style:italic;font-weight:400;color:var(--ember)}
.hello{font-family:var(--f-serif);font-size:1.85rem;font-weight:600;line-height:1.12;margin-bottom:6px;letter-spacing:-.01em}
.hello-sub{color:var(--dim);margin-bottom:20px}
.hero{position:relative;border-radius:26px;overflow:hidden;min-height:360px;display:flex;align-items:flex-end;isolation:isolate;border:1px solid var(--line);cursor:pointer}
.hero .cv,.wc .cv,.cover-big .cv{position:absolute;inset:0;z-index:-2}
.cv svg{width:100%;height:100%;display:block}
.hero .shade,.wc .shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(16,14,22,0) 25%,rgba(16,14,22,.55) 60%,rgba(16,14,22,.96) 100%)}
.hbody{padding:20px;width:100%;min-width:0;display:flex;flex-direction:column;gap:10px}
.hbody h2{font-size:calc(2rem*var(--fz,1));line-height:1.05;overflow-wrap:anywhere}
.snip{font-family:var(--f-serif);font-size:.95rem;color:#e6dccb;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.where{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:.82rem;min-width:0}
.where span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{display:none}
.rail>*{scroll-snap-align:start;flex:none}
.mini{width:148px;aspect-ratio:3/4;border-radius:18px;position:relative;overflow:hidden;isolation:isolate;border:1px solid var(--line);cursor:pointer;display:flex;align-items:flex-end}
.mini .cv{position:absolute;inset:0;z-index:-2}
.mini .shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 35%,rgba(16,14,22,.95))}
.mini div.mb{padding:11px;min-width:0;width:100%}
.mini b{display:block;font-size:calc(.98rem*var(--fz,1));line-height:1.1;overflow-wrap:anywhere}
.mini small{color:var(--dim);font-size:.74rem;display:block;margin-top:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wc{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:3/4.1;background:var(--s1);isolation:isolate;border:1px solid var(--line);border-bottom:3px solid var(--accent);cursor:pointer;display:flex;align-items:flex-end;transition:transform .18s}
.wc:active{transform:scale(.98)}
.wcb{padding:13px;width:100%;min-width:0;display:flex;flex-direction:column;gap:6px}
.wcb h3{font-size:calc(1.08rem*var(--fz,1));line-height:1.08;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wcb p{font-size:.78rem;color:#d3cabd;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.74rem;color:var(--dim);min-width:0}
.meta span{display:inline-flex;align-items:center;gap:4px;min-width:0}
.st{color:var(--dim)}
.st.live{color:var(--accent);font-weight:700}
.wl{display:flex;gap:14px;padding:10px;border-radius:20px;background:var(--s1);border:1px solid var(--line);border-left:3px solid var(--accent);cursor:pointer;min-width:0}
.wl .th{width:84px;aspect-ratio:3/4;border-radius:14px;overflow:hidden;flex:none;position:relative}
.wl .th .cv{position:absolute;inset:0}
.wl .tx{min-width:0;display:flex;flex-direction:column;gap:5px;justify-content:center;flex:1}
.wl h3{font-size:calc(1.1rem*var(--fz,1));overflow-wrap:anywhere}
.wl p{font-size:.82rem;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.newtile{border-radius:22px;border:1.5px dashed var(--faint);aspect-ratio:3/4.1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--dim);text-align:center;padding:16px;cursor:pointer}
.newtile b{color:var(--ink);font-family:var(--f-serif);font-size:1.05rem}
.newtile .pl{width:44px;height:44px;border-radius:50%;background:var(--s2);display:grid;place-items:center;color:var(--ember)}

/* worlds tab */
.sticky-h{padding:calc(var(--sat) + 14px) 20px 10px;background:linear-gradient(var(--bg) 82%,transparent);position:relative;z-index:2}
.sticky-h h1{font-family:var(--f-serif);font-size:1.7rem;font-weight:600;margin-bottom:12px}
.search{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:15px;padding:0 14px;min-height:50px;margin-bottom:12px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:1rem}
.search input::placeholder{color:var(--faint)}
.rowbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 12px;color:var(--dim);font-size:.85rem}
.seg{display:inline-flex;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{min-height:34px;padding:0 12px;border-radius:9px;color:var(--dim);font-size:.85rem;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.seg button.on{background:var(--s3);color:var(--ink)}
.empty{text-align:center;color:var(--dim);padding:48px 12px}
.empty b{display:block;font-family:var(--f-serif);font-size:1.2rem;color:var(--ink);margin-bottom:6px}
.stack-list{display:flex;flex-direction:column;gap:12px}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;padding:8px 6px calc(8px + var(--sab));background:linear-gradient(180deg,rgba(16,14,22,.82),rgba(16,14,22,.97) 40%);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabbar button{flex:1;min-width:0;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:.68rem;font-weight:600;border-radius:12px;position:relative}
.tabbar button.on{color:var(--ink)}
.tabbar button.on::after{content:"";position:absolute;top:-9px;width:22px;height:3px;border-radius:3px;background:var(--ember)}
.tabbar .mk{width:44px;height:36px;border-radius:13px;background:var(--ember);color:#17110a;display:grid;place-items:center}
.tabbar button.mkb.on::after{display:none}

/* details */
.cover-big{position:relative;height:46vh;min-height:300px;max-height:460px;isolation:isolate;overflow:hidden}
.cover-big::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,14,22,.35),rgba(16,14,22,0) 30%,rgba(16,14,22,.75) 78%,var(--bg));z-index:-1}
.float{position:absolute;top:calc(var(--sat) + 10px);left:12px;background:rgba(16,14,22,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:50%}
.dbody{padding:0 20px 24px;margin-top:-64px;position:relative}
.dbody h1{line-height:1.02;overflow-wrap:anywhere;margin:10px 0 6px}
.tag{font-family:var(--f-serif);font-style:italic;font-size:1.08rem;color:#e6dccb;margin-bottom:14px}
.dbody p.txt{color:#d6cdc0;max-width:62ch;overflow-wrap:anywhere}
.cr{display:flex;flex-direction:column;align-items:center;gap:6px;width:84px;text-align:center}
.cr b{font-size:.84rem;line-height:1.15;max-width:100%;overflow-wrap:anywhere}
.cr small{font-size:.7rem;color:var(--dim);line-height:1.2;max-width:100%;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rules{list-style:none;display:flex;flex-direction:column;gap:10px}
.rules li{display:flex;gap:12px;color:#d6cdc0;align-items:flex-start}
.rules li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:.5em}
.cta{flex:none;display:flex;gap:10px;padding:12px 20px calc(12px + var(--sab));background:linear-gradient(transparent,var(--bg) 28%);margin-top:-1px}
.prog{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;margin-top:22px}
.prog b{font-family:var(--f-serif);font-size:1.02rem}

/* avatars & meters */
.av{--s:40px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:grid;place-items:center;background:linear-gradient(145deg,hsl(var(--h) 46% 42%),hsl(var(--h) 52% 20%));box-shadow:0 0 0 2px hsl(var(--h) 55% 60% / .55);font-family:var(--f-serif);font-weight:700;font-size:calc(var(--s)*.42);color:#fff;text-transform:uppercase;overflow:hidden}
.avbtn{border-radius:50%;flex:none;display:block}
.meter{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;font-size:.85rem;min-width:0}
.meter .bar,.mt .mb{height:7px;border-radius:7px;background:rgba(239,231,218,.12);overflow:hidden}
.meter .bar i,.mt .mb i{display:block;height:100%;background:var(--c);border-radius:7px;transition:width .8s var(--ease)}
.meter b{font-variant-numeric:tabular-nums;min-width:3.6em;text-align:right;font-weight:600}
.meter .ml{display:inline-flex;gap:6px;align-items:center;min-width:5.5em}

/* sheets */
.sheetwrap{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:rgba(6,5,10,.6);opacity:0;transition:opacity .25s}
.sheet{position:relative;overflow:hidden;background:var(--s1);border-radius:26px 26px 0 0;max-height:90%;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s var(--ease);border-top:1px solid var(--line)}
.sheetwrap.in .scrim{opacity:1}
.sheetwrap.in .sheet{transform:none}
.grab{width:38px;height:4px;border-radius:4px;background:var(--faint);margin:9px auto 4px;flex:none;opacity:.6}
.sbody{overflow-y:auto;overscroll-behavior:contain;padding:8px 20px calc(22px + var(--sab));min-height:0}
.sheet.top{align-self:stretch}
.menu-i{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:0 4px;border-bottom:1px solid var(--line);font-weight:600}
.menu-i:last-child{border:0}
.menu-i .mi-ic{width:38px;height:38px;border-radius:12px;background:var(--s2);display:grid;place-items:center;color:var(--accent);flex:none}
.menu-i small{display:block;color:var(--dim);font-weight:400;font-size:.8rem}
.menu-i .grow{min-width:0}
.portrait{position:relative;height:210px;margin:0 -20px 14px;overflow:hidden;background:linear-gradient(160deg,hsl(var(--h) 42% 30%),hsl(var(--h) 50% 12%))}
.portrait svg{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);height:92%;width:auto}
.portrait .pn{position:absolute;left:20px;right:60px;bottom:12px}
.portrait h2{font-family:var(--f-serif);font-size:1.7rem;overflow-wrap:anywhere;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.portrait p{color:#e5dccb;font-size:.9rem}
.portrait::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(24,21,33,.85))}
.portrait .pn{z-index:2}
.portrait .xb{position:absolute;top:10px;right:10px;z-index:3;background:rgba(16,14,22,.5);border-radius:50%}
.kv{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill-i{display:inline-flex;gap:6px;align-items:center;background:var(--s2);border-radius:999px;padding:6px 12px;font-size:.82rem;max-width:100%}
.pill-i span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--s2);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.card h4,.sbody h4{font-size:.8rem;color:var(--dim);font-weight:600;letter-spacing:.02em}
.facts{list-style:none;display:flex;flex-direction:column;gap:8px}
.facts li{padding-left:16px;position:relative;color:#d6cdc0;overflow-wrap:anywhere}
.facts li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.sh-h{font-family:var(--f-serif);font-size:1.3rem;font-weight:600;margin:6px 0 12px}
.row-c{display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.row-c:last-child{border:0}
.row-c .tx{flex:1;min-width:0}
.row-c b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-c small{display:block;color:var(--dim);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mts{display:flex;gap:10px;flex:none}
.tierb{font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--s3);color:var(--ink);white-space:nowrap}

/* panels (inside world) */
.panel{position:absolute;inset:0;z-index:25;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .34s var(--ease)}
.panel.in{transform:none}
.panel>header,.pagehead{display:flex;align-items:center;gap:6px;padding:calc(var(--sat) + 8px) 8px 8px;border-bottom:1px solid var(--line);flex:none}
.panel h2,.pagehead h2{font-family:var(--f-serif);font-size:1.25rem;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbody{padding:16px 20px calc(24px + var(--sab))}
.tl-day{margin-bottom:22px}
.tl-day h3{font-family:var(--f-serif);font-size:1.1rem;margin-bottom:10px;color:var(--accent)}
.tl-ev{position:relative;padding:0 0 16px 22px;overflow-wrap:anywhere;color:#e1d8ca}
.tl-ev::before{content:"";position:absolute;left:4px;top:.55em;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.tl-ev::after{content:"";position:absolute;left:8px;top:1.5em;bottom:-.5em;width:1px;background:var(--line)}
.tl-ev:last-child::after{display:none}
.ob{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.ob .bx{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none;margin-top:1px}
.ob.done .bx{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ob.done span{color:var(--dim);text-decoration:line-through}
.ob span{overflow-wrap:anywhere}
.bigcnt{font-family:var(--f-serif);font-size:2.4rem;font-weight:600}
.faces{display:flex;gap:-6px;flex-wrap:wrap;gap:10px}

/* chat */
#s-chat{--ch:var(--accent)}
.chat-h{display:flex;align-items:center;gap:2px;padding:calc(var(--sat) + 6px) 6px 6px;flex:none;border-bottom:1px solid var(--line);background:var(--bg);z-index:3}
.ttl{flex:1;min-width:0;padding:0 4px}
.ttl .t{font-size:1.08rem;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .sub{display:flex;align-items:center;gap:7px;font-size:.76rem;color:var(--dim);min-width:0;white-space:nowrap}
.ttl .sub #sub-scene{overflow:hidden;text-overflow:ellipsis;min-width:0}
.dotsep{width:3px;height:3px;border-radius:50%;background:var(--faint);flex:none}
.save{flex:none;display:inline-flex;align-items:center;gap:5px}
.save::before{content:"";width:6px;height:6px;border-radius:50%;background:#6fc89b}
.save.busy::before{background:var(--ember);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.strip{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:6px 14px;background:var(--s1);border-bottom:1px solid var(--line);flex:none;z-index:3}
.strip .sn{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.15}
.strip .sn b{font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip .sn small{font-size:.72rem;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt{display:inline-grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:5px;align-items:center;font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.mt .mi{font-size:.9rem}
.mt .mn small{font-size:.62rem;color:var(--faint);font-weight:500}
.mt .mb{grid-column:1/3;height:4px;min-width:46px}
.chev{color:var(--dim);flex:none}
.banner{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#3b2a16;color:#f0cf9d;font-size:.82rem;flex:none}
.banner[hidden]{display:none}
.feedwrap{flex:1;min-height:0;position:relative;background:var(--bg)}
.chat-bg{position:absolute;inset:0;opacity:.2;filter:saturate(.7) blur(3px);transform:scale(1.08);pointer-events:none}
.chat-bg svg{width:100%;height:100%}
.chat-veil{position:absolute;inset:0;background:linear-gradient(180deg,var(--bg),rgba(16,14,22,.55) 40%,rgba(16,14,22,.82));pointer-events:none}
#feed{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:16px 14px 18px;scrollbar-width:none;overflow-anchor:none}
#feed::-webkit-scrollbar{display:none}
#feed-in{display:flex;flex-direction:column;gap:10px;min-width:0}
.m{min-width:0;max-width:100%}
.m.pop{animation:pop .4s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}
.bub,.m.nar p,.err .card,.think{overflow-wrap:anywhere;word-break:break-word;white-space:pre-wrap;min-width:0;max-width:100%}
.m.nar{padding:6px 4px 6px 14px;border-left:2px solid color-mix(in srgb,var(--accent) 55%,transparent);margin:4px 0 4px 2px}
.m.nar p{font-family:var(--f-serif);font-size:var(--chat-fs);line-height:1.68;color:#dcd2c3}
.m.nar p em,.bub em{color:var(--accent);font-style:italic}
.m.say{display:flex;gap:9px;align-items:flex-start;padding-right:8%}
.m.say .av{--s:34px}
.m.say.grp .av-sp{width:34px;flex:none}
.m.say .col{min-width:0;flex:0 1 auto;max-width:calc(100% - 43px);display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.who{display:flex;align-items:baseline;gap:7px;max-width:100%;min-width:0;padding:2px 2px 0}
.who .wn{font-weight:700;font-size:.82rem;color:hsl(var(--ch) 72% 74%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.who .wr{font-size:.7rem;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 100 auto}
.m.say .bub{background:rgba(34,30,45,.94);border:1px solid var(--line);border-left:3px solid hsl(var(--ch) 60% 58%);border-radius:5px 18px 18px 18px;padding:10px 14px;font-size:var(--chat-fs);line-height:1.5}
.m.say.grp .bub{border-radius:5px 18px 18px 5px}
.m.user{display:flex;flex-direction:column;align-items:flex-end;padding-left:14%}
.m.user .you{font-size:.72rem;font-weight:700;color:var(--accent);padding:0 4px 3px}
.m.user .bub{background:rgba(120,90,60,.4);background:color-mix(in srgb,var(--accent) 24%,#1d1926);border:1px solid color-mix(in srgb,var(--accent) 38%,transparent);border-radius:18px 18px 5px 18px;padding:10px 14px;font-size:var(--chat-fs);line-height:1.5}
.m.evt{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:.76rem;font-weight:600;padding:8px 0}
.m.evt::before,.m.evt::after{content:"";flex:1;height:1px;background:var(--line)}
.m.evt span{max-width:80%;text-align:center;overflow-wrap:anywhere}
.m.tl{display:flex;justify-content:center}
.m.tl span{display:inline-flex;align-items:center;gap:7px;background:color-mix(in srgb,var(--accent) 13%,transparent);color:color-mix(in srgb,var(--accent) 85%,#fff);border-radius:999px;padding:6px 12px;font-size:.78rem;font-weight:600;max-width:92%;overflow-wrap:anywhere;text-align:center}
.m.delta{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.m.delta span{background:var(--s2);border-radius:999px;padding:4px 10px;font-size:.74rem;color:var(--dim);font-weight:600}
.m.delta b{color:var(--ink)}
.think{display:flex;align-items:center;gap:4px;font-size:.84rem;font-style:italic;color:var(--dim);padding:9px 2px;white-space:normal}
.dots{display:inline-flex;gap:3px;margin-left:5px}
.dots u{width:5px;height:5px;border-radius:50%;background:hsl(var(--ch) 65% 65%);animation:ink 1.2s infinite ease-in-out}
.dots u:nth-child(2){animation-delay:.16s}.dots u:nth-child(3){animation-delay:.32s}
@keyframes ink{0%,70%,100%{transform:scale(.6);opacity:.35}35%{transform:scale(1.15);opacity:1}}
.m.typing.nar-t{padding-left:16px}
.m.err .card{background:rgba(201,90,90,.12);border:1px solid rgba(201,90,90,.4);border-radius:16px;padding:13px 14px;display:flex;flex-direction:column;gap:10px;white-space:normal}
.m.err b{font-size:.95rem}.m.err p{font-size:.86rem;color:#e2c3c3}
.m.err .btn{min-height:42px;align-self:flex-start;background:#c95a5a;color:#fff}
.m.regen{display:flex;justify-content:center;padding:2px 0 6px}
.m.regen .chip{min-height:38px;background:var(--s1);color:var(--ink)}
.earlier{align-self:center;color:var(--dim);font-size:.82rem;padding:8px 14px;border-radius:99px;background:var(--s1);border:1px solid var(--line);min-height:40px}
.pill{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);min-height:38px;padding:0 14px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:.82rem;display:inline-flex;gap:5px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:4}
.pill[hidden]{display:none}
.composer{flex:none;background:var(--s1);border-top:1px solid var(--line);padding:8px 10px calc(8px + var(--sab));z-index:3}
.crow{display:flex;align-items:flex-end;gap:6px}
.field{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:2px 14px;display:flex}
.field:focus-within{border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
#ta{flex:1;min-width:0;width:100%;background:none;border:0;outline:0;resize:none;font-size:max(16px,var(--chat-fs));line-height:1.4;padding:10px 0;max-height:132px;overflow-y:auto;overflow-wrap:anywhere}
#ta::placeholder{color:var(--faint)}
.send{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none;transition:transform .15s,opacity .2s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.send:active{transform:scale(.92)}
.send.off{background:var(--s3);color:var(--faint)} /* busy look only: the button stays tappable so a tap is never silently lost */
.send.rec{background:#c95a5a;color:#fff;animation:pulse 1s infinite}
.tool{color:var(--dim);width:42px;height:46px}
.tool[aria-expanded="true"]{color:var(--accent)}
.sugg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 2px 8px}
.sugg::-webkit-scrollbar{display:none}
.sugg[hidden],.ctx[hidden]{display:none}
.sugg .chip{background:var(--bg)}
.ctx{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--dim);padding:0 4px 8px}
.ctx b{color:var(--ink)}
.ctx button{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:var(--s3)}
.veil{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center;transition:opacity .6s;overflow:hidden}
.veil .cv{position:absolute;inset:0;opacity:.35;filter:blur(6px);transform:scale(1.1);z-index:0}
.veil>*:not(.cv){position:relative;z-index:1}
.veil h2{font-size:calc(2.1rem*var(--fz,1));line-height:1.05;overflow-wrap:anywhere}
.veil .ln{width:120px;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.veil .ln i{display:block;height:100%;width:40%;background:var(--accent);animation:slide 1.1s infinite ease-in-out}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.veil.out{opacity:0;pointer-events:none}

/* create */
.cta-hero{border-radius:26px;padding:24px 20px;background:radial-gradient(120% 120% at 100% 0,#5b3a2a,transparent 60%),linear-gradient(160deg,#2a2036,#181521);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px;margin-bottom:8px}
.cta-hero h2{font-family:var(--f-serif);font-size:1.7rem;font-weight:600;line-height:1.1}
.tpl{display:flex;flex-direction:column;gap:3px;width:210px;padding:14px;border-radius:18px;background:var(--s1);border:1px solid var(--line);cursor:pointer}
.tpl b{font-family:var(--f-serif);font-size:1.02rem}
.tpl small{color:var(--dim);font-size:.8rem}
.wiz-top{padding:calc(var(--sat) + 8px) 8px 10px;flex:none;border-bottom:1px solid var(--line)}
.wiz-top .r{display:flex;align-items:center;gap:6px}
.wiz-top h2{flex:1;font-family:var(--f-serif);font-size:1.2rem;font-weight:600;min-width:0}
.steps{display:flex;gap:5px;padding:4px 14px 0}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--s3)}
.steps i.on{background:var(--ember)}
.fld{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
.fld>span{font-size:.86rem;font-weight:600;color:var(--dim)}
.fld small{font-size:.76rem;color:var(--faint)}
.fld input,.fld textarea,.inp{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:1rem;outline:0;min-height:50px;resize:vertical;overflow-wrap:anywhere}
.fld input:focus,.fld textarea:focus,.inp:focus{border-color:var(--ember)}
.wiz-foot{flex:none;padding:10px 20px calc(12px + var(--sab));border-top:1px solid var(--line);background:var(--bg)}
.wiz-foot .r{display:flex;gap:10px}
.hint{font-size:.78rem;color:var(--dim);min-height:1.2em;margin-bottom:8px}
.tpl-c{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--s1);border:1px solid var(--line);margin-bottom:8px;min-width:0}
.tpl-c .tx{flex:1;min-width:0}
.tpl-c b,.tpl-c small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpl-c small{color:var(--dim);font-size:.78rem}
.addbox{background:var(--s1);border:1px dashed var(--faint);border-radius:18px;padding:14px;margin-top:6px}
.addbox .fld{margin-bottom:12px}
.covers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.covers button{aspect-ratio:3/4;border-radius:14px;overflow:hidden;position:relative;border:2px solid transparent}
.covers button.on{border-color:var(--ink)}
.covers .cv{position:absolute;inset:0}
.covers span{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 5px;background:linear-gradient(transparent,rgba(0,0,0,.75));font-size:.72rem;font-weight:700;text-align:center}
.pals{display:flex;gap:12px;flex-wrap:wrap}
.pals button{width:44px;height:44px;border-radius:50%;border:2px solid transparent;position:relative;overflow:hidden}
.pals button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}
.prev{width:60%;margin:0 auto 6px;pointer-events:none}

/* activity / profile */
.feed-i{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);min-width:0}
.feed-i .dot{width:10px;height:10px;border-radius:50%;margin-top:.45em;flex:none;background:var(--accent)}
.feed-i .tx{min-width:0;flex:1;overflow-wrap:anywhere}
.feed-i small{display:block;color:var(--dim);font-size:.78rem;margin-top:2px}
.pro-h{display:flex;align-items:center;gap:16px;margin:6px 0 22px}
.pro-h .av{--s:68px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
.stats div{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.stats b{display:block;font-family:var(--f-serif);font-size:1.5rem}
.stats small{color:var(--dim);font-size:.74rem}
.set{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:56px;border-bottom:1px solid var(--line);padding:6px 0}
.set>div:first-child{min-width:0}
.set small{display:block;color:var(--dim);font-size:.78rem}
.sw{width:50px;height:30px;border-radius:30px;background:var(--s3);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
.sw.on{background:var(--ember)}.sw.on::after{transform:translateX(20px)}
details.dev{margin-top:20px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:0 14px}
details.dev summary{min-height:52px;display:flex;align-items:center;font-weight:600;list-style:none;cursor:pointer}
details.dev summary::-webkit-details-marker{display:none}
details.dev .btn{width:100%;margin-bottom:10px}

#toast{position:absolute;left:50%;bottom:calc(var(--tab-h) + var(--sab) + 18px);transform:translate(-50%,20px);background:var(--ink);color:#17110a;padding:11px 18px;border-radius:14px;font-weight:600;font-size:.88rem;opacity:0;pointer-events:none;transition:all .3s var(--ease);z-index:100;max-width:88%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:340px){.hello{font-size:1.55rem}.grid{gap:10px}.wcb h3{font-size:.98rem}}
</style>
</head>
<body>
<div id="app">
  <main>
    <section class="screen tab on" id="t-home"></section>
    <section class="screen tab" id="t-worlds"></section>
    <section class="screen tab" id="t-create"></section>
    <section class="screen tab" id="t-activity"></section>
    <section class="screen tab" id="t-profile"></section>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  <section class="screen stack" id="s-details"></section>
  <section class="screen stack" id="s-chat"></section>
  <section class="screen stack" id="s-wizard"></section>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script>
'use strict';
/* =====================================================================
   STORYVERSE — an app of interactive Worlds.
   Structure:  utils → covers → world data → store → engine → UI shell →
               tabs → details → chat → create-world wizard → init
   To add a world: push an object shaped like the ones in WORLDS.
   AI replies come from /api/chat (api/chat.js on Vercel, which calls Groq). Progress is saved in this browser.
   ===================================================================== */
const APP_NAME='StoryVerse';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>esc(s).replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
const clamp=(n,a=0,b=100)=>Math.max(a,Math.min(b,n));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const h=html=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild};
const firstName=n=>String(n).replace(/^(Dr\.|Mr\.|Mrs\.|Miss|Ms\.|Insp\.|Cmdr\.|Captain|Commander|Thane)\s+/i,'').split(/\s+/)[0];
const ago=t=>{const m=Math.round((Date.now()-t)/60000);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
const app=$('#app');

const ICON={
back:'<path d="M15 5l-7 7 7 7"/>',more:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/>',home:'<path d="M4 11l8-7 8 7v8a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z"/>',
worlds:'<rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/>',
plus:'<path d="M12 5v14M5 12h14"/>',activity:'<path d="M3 12h4l3-7 4 14 3-7h4"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
send:'<path d="M4 12l16-8-6 16-3-7z"/>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>',
close:'<path d="M6 6l12 12M18 6L6 18"/>',down:'<path d="M6 9l6 6 6-6"/>',right:'<path d="M9 5l7 7-7 7"/>',
spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16v4M17 18h4"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.3-5 6.5-5s5.7 1.5 6.5 5"/><path d="M16 5a3.5 3.5 0 010 6.5M18 15c2 .6 3.2 2.2 3.5 5"/>',
heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 017-2.5A4 4 0 0119 10c0 5.6-7 10-7 10z"/>',clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/>',
flag:'<path d="M6 21V4M6 5h11l-2 4 2 4H6"/>',info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8v.1"/>',
save:'<path d="M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6"/>',check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
pin:'<path d="M12 21s-6-5.500-6-11a6 6 0 0112 0c0 5.500-6 11-6 11z"/><circle cx="12" cy="10" r="2"/>',
retry:'<path d="M20 12a8 8 0 11-2.600-5.900M20 4v5h-5"/>',wifi:'<path d="M3 9a14 14 0 0118 0M6 12.500a9.500 9.500 0 0112 0M9 16a5 5 0 016 0M12 19.500v.1M4 4l16 16"/>',
list:'<path d="M5 7h14M5 12h14M5 17h14"/>',grid:'<rect x="4" y="4" width="7" height="7" rx="1.500"/><rect x="13" y="4" width="7" height="7" rx="1.500"/><rect x="4" y="13" width="7" height="7" rx="1.500"/><rect x="13" y="13" width="7" height="7" rx="1.500"/>',
target:'<circle cx="12" cy="12" r="8.500"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6"/>',trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',
situ:'<path d="M12 21s-6-5.500-6-11a6 6 0 0112 0c0 5.500-6 11-6 11z"/>',globe:'<circle cx="12" cy="12" r="8.500"/><path d="M3.500 12h17M12 3.500c3 3 3 14 0 17M12 3.500c-3 3-3 14 0 17"/>'
};
const ic=(n,s=22)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]||''}</svg>`;

/* ---------- procedural cover art (no image files needed; swap for real art any time via w.img) ---------- */
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
let _cid=0;
function cover(kind,pal){
  const id='c'+(++_cid),[a,b,c]=pal,R=rng(kind.length*131+a.charCodeAt(2)*7+c.charCodeAt(3)*3);
  const sky=(stops=[0,.62,1])=>`<defs><linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="${stops[0]}" stop-color="${a}"/><stop offset="${stops[1]}" stop-color="${b}"/><stop offset="${stops[2]}" stop-color="${c}"/></linearGradient><radialGradient id="${id}g"><stop offset="0" stop-color="${c}" stop-opacity=".85"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient><linearGradient id="${id}l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".24"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><filter id="${id}f"><feGaussianBlur stdDeviation="14"/></filter></defs><rect width="400" height="500" fill="url(#${id}s)"/>`;
  const stars=(n,y1=0,y2=260)=>{let s='';for(let i=0;i<n;i++)s+=`<circle cx="${R()*400|0}" cy="${y1+R()*(y2-y1)|0}" r="${(R()*1.1+.3).toFixed(1)}" fill="#fff" opacity="${(R()*.6+.2).toFixed(2)}"/>`;return s};

const W=id=>WORLDS.find(w=>w.id===id);

/* ---------- store (saved in this browser's localStorage) ---------- */
const LS_KEY='storyverse.v1',LS_OLD='kahani.v1',MAX_SAVED_MSGS=500; // LS_OLD: saves made before the rename are picked up once, then moved
const Store={
  data:{player:{name:'Ajaz'},settings:{fs:'m',rm:false,deltas:true,failNext:false,offline:false},states:{}},
  get(id){return this.data.states[id]},
  init(w){
    const rel={};w.chars.forEach(c=>{rel[c.id]={[w.vars[0].k]:c.r[0],[w.vars[1].k]:c.r[1]}});
    const s={day:w.start.day,time:w.start.time,loc:w.start.loc,situation:w.start.situation,present:[...w.start.present],focus:null,msgs:[],rel,mood:{},
      events:[],obj:{},known:Object.fromEntries(w.chars.map(c=>[c.id,[...c.known]])),turns:0,opened:false,updated:Date.now(),gen:false};
    ensureState(w,s);
    this.data.states[w.id]=s;return s;
  },
  touch(s){s.updated=Date.now();this.saveSoon()},
  _t:null,_cbs:[],_warned:false,
  saveSoon(cb){if(cb)this._cbs.push(cb);clearTimeout(this._t);this._t=setTimeout(()=>this.saveNow(),350)},
  saveNow(){
    clearTimeout(this._t);this._t=null;const cbs=this._cbs.splice(0);
    try{
      const d=this.data,states={};
      Object.keys(d.states).forEach(id=>{const s=d.states[id];states[id]={...s,gen:false,msgs:s.msgs.filter(m=>m.t!=='err').slice(-MAX_SAVED_MSGS)}});
      const custom=WORLDS.filter(w=>w.custom).map(w=>{const c={...w};delete c.cover;return c});
      localStorage.setItem(LS_KEY,JSON.stringify({v:1,player:d.player,settings:{fs:d.settings.fs,rm:d.settings.rm,deltas:d.settings.deltas},states,custom}));
      try{localStorage.removeItem(LS_OLD)}catch(e){}
    }catch(e){if(!this._warned){this._warned=true;toast('Could not save in this browser (storage full or blocked).')}}
    cbs.forEach(f=>{try{f()}catch(e){}});
  },
  load(){
    try{
      const raw=localStorage.getItem(LS_KEY)||localStorage.getItem(LS_OLD);if(!raw)return false;
      const j=JSON.parse(raw);if(!j||j.v!==1||!j.states)return false;
      (j.custom||[]).forEach(w=>{if(w&&w.id&&!W(w.id)){w.cover=cover(w.kind,w.pal);WORLDS.push(w)}});
      if(j.player&&j.player.name)this.data.player.name=String(j.player.name).slice(0,30);
      Object.assign(this.data.settings,j.settings||{});
      Object.keys(j.states).forEach(id=>{if(W(id)){const s=j.states[id];s.gen=false;ensureState(W(id),s);this.data.states[id]=s}});
      return true;
    }catch(e){return false}
  }
};
addEventListener('pagehide',()=>Store.saveNow());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')Store.saveNow()});
let uid=0;
/* World State: everything the story must stay consistent with. The browser owns it; the AI only proposes changes.
   sub = exact spot, activity = what is going on, nearby = can see/hear the scene edge, unresolved = open threads,
   cs[id] = per-character { where, doing, goal, intent }, mins = story minutes since the start. */
const isAlways=c=>/everywhere/i.test(c.loc||'');
const sameSpot=(a,b)=>{a=String(a||'').toLowerCase().trim();b=String(b||'').toLowerCase().trim();return !!a&&!!b&&(a===b||a.includes(b)||b.includes(a))};
function ensureState(w,s){
  if(typeof s.sub!=='string')s.sub='';
  if(typeof s.activity!=='string')s.activity='';
  if(!Array.isArray(s.nearby))s.nearby=[];
  if(!Array.isArray(s.unresolved))s.unresolved=[];
  if(typeof s.mins!=='number')s.mins=0;
  if(!s.cs||typeof s.cs!=='object')s.cs={};
  w.chars.forEach(c=>{
    if(!s.cs[c.id])s.cs[c.id]={where:c.loc||'',doing:'',goal:'',intent:''};
    if(!s.known[c.id])s.known[c.id]=[...c.known];
    if(!s.rel[c.id])s.rel[c.id]={[w.vars[0].k]:c.r[0],[w.vars[1].k]:c.r[1]};
  });
  syncWhere(w,s);
}
function syncWhere(w,s){s.present.forEach(id=>{if(s.cs[id])s.cs[id].where=s.loc});s.nearby=s.nearby.filter(id=>!s.present.includes(id))}
const bm=b=>typeof b==='string'?{t:'nar',text:b}:b[0]==='evt'?{t:'evt',text:b[1]}:{t:'say',who:b[0],text:b[1]};
function seedStates(){
  const now=Date.now();
  { // college — mid-story
    const w=W('college'),s=Store.init(w);s.opened=true;
    s.msgs=[...w.opening.map(bm),{t:'user',text:'Ajaz'},bm(['vivaan','Ajaz? Arre, yeh toh apna introduction de raha hai.']),bm(['isha','Mujhe tumhara naam nahi, meri kitaabein chahiye.']),
      bm('Ek haath tumhare saamne aata hai — Kritika. Woh chupchaap kitaabein samet rahi hai.'),bm(['kritika','Main help kar deti hoon. Main Kritika. Tum first year ho na?']),{t:'tl',text:'Met Kritika'}].map(m=>({...m,id:++uid}));
    s.events=['Arrived at college','Collided with Isha in the corridor',"Met Isha's group",'Met Kritika'].map((t,i)=>({day:1,text:t,ts:now-(40-i)*60000}));
    s.rel.kritika={love:20,hate:0};s.focus='isha';s.turns=1;s.present=['isha','vivaan','kritika'];s.updated=now-18*60000;s.mood.isha='Furious';s.mood.kritika='Helpful';
    s.known.isha.push('She is not impressed by apologies that come late.');s.known.kritika.push('She offered to help without being asked.');
  }
  { // investigation
    const w=W('case'),s=Store.init(w);s.opened=true;
    s.msgs=[...w.opening.map(bm),...w.seed.msgs.map(m=>m.t?m:bm(m))].map(m=>({...m,id:++uid}));
    s.events=w.seed.events.map((t,i)=>({day:1,text:t,ts:now-w.seed.ago*60000+i*1000}));w.seed.obj.forEach(o=>s.obj[o]=true);
    s.turns=w.seed.turns;s.updated=now-w.seed.ago*60000;s.loc='Display hall';s.focus='dev';s.present=['dev','rao'];
  }
  Object.keys(Store.data.states).forEach(id=>{const w=W(id);if(w)ensureState(w,Store.data.states[id])});
}

/* ---------- engine ----------
   Engine.generate() sends the world, characters, current state and recent story to /api/chat.
   That serverless function (api/chat.js) holds the hidden prompt and the Groq key, and returns
   { beats:[{t:'nar'|'say',who?,text}], deltas:[{who,p,n}], events:[], mood:{}, obj:[], loc, present, focus }.
   Engine.demo() is the old keyword engine. It is only used when no server is reachable
   (for example when this file is opened straight from disk). */
const API_URL='/api/chat';
const POS=/sorry|maaf|thanks|thank|shukriya|please|plz|dost|friend|help|madad|accha|achha|nice|great|pyaar|love|dhanyavaad/i, NEG=/stupid|idiot|shut|chup|bakwas|hate|nafrat|pagal|gadha|useless|bewakoof/i;
const score=(w,s,id)=>{const r=s.rel[id];return r[w.vars[0].k]-r[w.vars[1].k]};
const tierKey=sc=>sc<-30?'cold':sc>30?'warm':'neutral';
const tierName=sc=>sc<=-60?'Hostile':sc<-25?'Cold':sc<=25?'Neutral':sc<60?'Warm':'Close';
const Engine={
  async demo({w,s,text,target}){
    await sleep(750+Math.random()*700);
    const st=Store.data.settings;
    if(st.offline||navigator.onLine===false)throw {kind:'net'};
    if(st.failNext){st.failNext=false;throw {kind:'gen'}}
    const you=Store.data.player.name,sub=t=>t.replace(/\{you\}/g,you);
    const out={beats:[],deltas:[],events:[],mood:{},obj:[],loc:null,present:null,focus:null};
    const rule=(w.script||[]).find(r=>r.re.test(text));
    if(rule){
      out.beats=rule.beats.map(b=>typeof b==='string'?{t:'nar',text:sub(b)}:{t:'say',who:b[0],text:sub(b[1])});
      (rule.d||[]).forEach(([who,p,n])=>out.deltas.push({who,p,n}));
      if(rule.ev)out.events.push(rule.ev);out.mood=rule.mood||{};out.obj=rule.obj||[];out.loc=rule.loc||null;out.present=rule.present||null;out.focus=rule.focus||null;
    }else{
      const who=target||s.focus||s.present[0]||w.chars[0].id,c=charOf(w,who);
      let pd=0,nd=0;
      if(text.trim().length<3)out.beats.push({t:'nar',text:'Kuch pal ki khamoshi. Sab tumhe dekh rahe hain.'});
      else{
        if(POS.test(text)){pd=6;nd=-8}else if(NEG.test(text)){pd=-5;nd=9}else{pd=1;nd=0}
        out.beats.push({t:'nar',text:pick([`${firstName(c.name)} ki nazar tum par tik jaati hai.`,'Aas-paas ka shor ek pal ke liye dheema ho jaata hai.',`${firstName(c.name)} ke chehre par ek bhaav aata hai, phir chala jaata hai.`])});
        const tk=tierKey(score(w,s,who)+pd-nd),L=c.lines[tk]||c.lines.neutral;
        out.beats.push({t:'say',who,text:sub(pick(L))});
        out.deltas.push({who,p:pd,n:nd});
                out.focus=who;
      }
    }
    return out;
  },
  demoFallback(a){if(!Engine._warned){Engine._warned=true;toast('AI server not found, so these are demo replies.')}return Engine.demo(a)},
  async generate(a){
    const {w,s,text,target}=a,st=Store.data.settings;
    if(st.offline||navigator.onLine===false)throw {kind:'net'};
    if(st.failNext){st.failNext=false;throw {kind:'gen',hint:'Simulated failure from developer tools.'}}
    const ac=new AbortController(),to=setTimeout(()=>ac.abort(),45000);
    let res,data=null;
    try{
      res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(buildPayload(w,s,text,target)),signal:ac.signal});
      if(res.status!==404&&res.status!==405&&res.status!==501){try{data=await res.json()}catch(e){if(e&&e.name==='AbortError')throw e}}
    }catch(e){
      clearTimeout(to);
      if(location.protocol==='file:')return Engine.demoFallback(a);
      if(e&&e.name==='AbortError')throw {kind:'gen',hint:'The AI took too long to answer.'};
      throw {kind:'net'};
    }
    clearTimeout(to);
    if(res.status===404||res.status===405||res.status===501)return Engine.demoFallback(a);
    if(!res.ok||!data||!Array.isArray(data.beats))throw {kind:'gen',hint:(data&&data.message)||('Server error '+res.status+'.')};
    return normalizeOut(w,s,data,target);
  }
};
function buildPayload(w,s,text,target){
  let msgs=s.msgs.filter(m=>m.t==='nar'||m.t==='say'||m.t==='user'||m.t==='evt');
  if(msgs.length&&msgs[msgs.length-1].t==='user')msgs=msgs.slice(0,-1); // the current message is sent separately
  return {
    player:Store.data.player.name,text,target:target||null,
    world:{name:w.name,cat:w.cat,genre:w.genre,setting:w.setting,role:w.role,rules:w.rules,vars:w.vars.map(v=>({k:v.k,label:v.label})),
      objectives:w.objectives.map(o=>({id:o.id,t:o.t,done:!!s.obj[o.id]}))},
    chars:w.chars.map(c=>({id:c.id,name:c.name,role:c.role,traits:c.traits,bio:c.bio,mood:s.mood[c.id]||c.mood,present:s.present.includes(c.id),
      near:s.nearby.includes(c.id),always:isAlways(c),where:(s.cs[c.id]||{}).where||'',doing:(s.cs[c.id]||{}).doing||'',goal:(s.cs[c.id]||{}).goal||'',intent:(s.cs[c.id]||{}).intent||'',
      rel:s.rel[c.id],tier:tierName(score(w,s,c.id)),known:(s.known[c.id]||[]).slice(-8),
      voice:w.custom?null:{cold:(c.lines.cold||[])[0]||'',neutral:(c.lines.neutral||[])[0]||'',warm:(c.lines.warm||[])[0]||''}})),
    state:{day:s.day,time:s.time,loc:s.loc,sub:s.sub,activity:s.activity,situation:s.situation,focus:s.focus,unresolved:s.unresolved},
    events:s.events.slice(-25).map(e=>`Day ${e.day}: ${e.text}`),
    history:msgs.slice(-20).map(m=>({t:m.t,who:m.who||null,wit:m.wit||[],text:m.text}))
  };
}
/* The AI only PROPOSES changes. This is the rulebook that decides what is allowed to become real.
   - only characters who are in the scene, nearby, or reachable from anywhere can speak
   - a character can only ENTER the scene if they were already nearby (or already at the new location);
     anybody else has to be announced as "nearby" first and can arrive in a later reply
   - relationship changes are small and only for people who were actually there
   - knowledge is only learned by people who witnessed it; story time moves a few minutes at most */
const RULES={maxRel:8,maxMins:30,maxBeats:6,maxEnter:1,maxKnown:14,maxOpen:6};
function validateOut(w,s,o,target){
  const ids=new Set(w.chars.map(c=>c.id)),always=new Set(w.chars.filter(isAlways).map(c=>c.id));
  const hear=new Set([...s.present,...s.nearby,...always]);            // who can be heard this reply
  const out={beats:[],deltas:[],events:[],mood:{},obj:[],loc:null,present:null,focus:null,
    sub:null,activity:null,adv:0,nearby:null,goals:{},intents:{},know:[],open:[],close:[],situation:null};
  const seen=new Set();
  (o.beats||[]).forEach(b=>{
    if(out.beats.length>=RULES.maxBeats||!b||typeof b.text!=='string'||!b.text.trim())return;
    const key=(b.who||'')+'|'+b.text.trim().toLowerCase();if(seen.has(key))return;seen.add(key);
    if(b.t==='say'){if(ids.has(b.who)&&hear.has(b.who))out.beats.push({t:'say',who:b.who,text:b.text})}
    else out.beats.push({t:'nar',text:b.text});
  });
  if(!out.beats.length){
    const tc=target&&w.chars.find(c=>c.id===target);
    if(tc&&!hear.has(tc.id))out.beats.push({t:'nar',text:'Koi jawab nahi aata — '+firstName(tc.name)+' yahan hai hi nahi.'});
    else throw {kind:'gen',hint:'The AI sent an empty reply. Try again.'};
  }
  const speakers=new Set(out.beats.filter(b=>b.t==='say').map(b=>b.who));
  const saw=new Set([...s.present,...always,...speakers]);              // witnesses of this exchange
  (o.deltas||[]).forEach(d=>{if(d&&saw.has(d.who)&&s.rel[d.who])out.deltas.push({who:d.who,p:clamp(Math.round(+d.p||0),-RULES.maxRel,RULES.maxRel),n:clamp(Math.round(+d.n||0),-RULES.maxRel,RULES.maxRel)})});
  (o.events||[]).slice(0,1).forEach(t=>{if(typeof t==='string'&&t.trim())out.events.push(t.trim().slice(0,90))});
  Object.entries(o.mood||{}).forEach(([k,v])=>{if(saw.has(k)&&typeof v==='string'&&v.trim())out.mood[k]=v.trim().slice(0,24)});
  out.obj=(o.obj||[]).filter(x=>w.objectives.some(ob=>ob.id===x));
  if(typeof o.loc==='string'&&o.loc.trim()&&!sameSpot(o.loc,s.loc))out.loc=o.loc.trim().slice(0,60);
  const newLoc=out.loc||s.loc;
  if(typeof o.sub==='string'&&o.sub.trim())out.sub=o.sub.trim().slice(0,60);
  if(typeof o.activity==='string'&&o.activity.trim())out.activity=o.activity.trim().slice(0,80);
  out.adv=clamp(Math.round(+o.adv||0),0,RULES.maxMins);
  // presence: leaving is free, entering needs a reason the engine can check
  if(Array.isArray(o.present)){
    const want=[...new Set(o.present.filter(i=>ids.has(i)))],keep=want.filter(i=>s.present.includes(i));
    const enter=want.filter(i=>!s.present.includes(i)&&(s.nearby.includes(i)||always.has(i)||(out.loc&&sameSpot((s.cs[i]||{}).where,newLoc)))).slice(0,RULES.maxEnter+(out.loc?3:0));
    const p=[...keep,...enter];
    if(p.length)out.present=p;
  }
  const inScene=out.present||s.present;
  if(Array.isArray(o.nearby)){
    out.nearby=[...new Set(o.nearby.filter(i=>ids.has(i)&&!inScene.includes(i)))].slice(0,3);
  }
  if(ids.has(o.focus)&&(inScene.includes(o.focus)||always.has(o.focus)))out.focus=o.focus;
  Object.entries(o.goals||{}).forEach(([k,v])=>{if(ids.has(k)&&(hear.has(k))&&typeof v==='string'&&v.trim())out.goals[k]=v.trim().slice(0,120)});
  Object.entries(o.intents||{}).forEach(([k,v])=>{if(ids.has(k)&&(hear.has(k))&&typeof v==='string'&&v.trim())out.intents[k]=v.trim().slice(0,120)});
  (o.know||[]).slice(0,3).forEach(k=>{if(k&&saw.has(k.who)&&typeof k.text==='string'&&k.text.trim())out.know.push({who:k.who,text:k.text.trim().slice(0,120)})});
  (o.open||[]).slice(0,2).forEach(t=>{if(typeof t==='string'&&t.trim())out.open.push(t.trim().slice(0,90))});
  (o.close||[]).slice(0,2).forEach(t=>{if(typeof t==='string'&&t.trim())out.close.push(t.trim())});
  if(typeof o.situation==='string'&&o.situation.trim())out.situation=o.situation.trim().slice(0,180);
  return out;
}
function normalizeOut(w,s,o,target){return validateOut(w,s,o,target)}

const Layers={stack:[],
  push(close,tag){let h2=false;try{history.pushState({k:this.stack.length+1},'');h2=true}catch(e){}this.stack.push({close,tag,h:h2})},
  top(){return this.stack[this.stack.length-1]},
  replaceTop(close,tag){const t=this.top();if(t){t.close(true);t.close=close;t.tag=tag}else this.push(close,tag)},
  pop(){const t=this.stack.pop();if(t)t.close(false)},
  back(){const t=this.top();if(!t)return;if(t.h){try{history.back();return}catch(e){}}this.pop()},
  has(tag){return this.stack.some(l=>l.tag===tag)}
};
addEventListener('popstate',()=>Layers.pop());

/* One send path for the arrow button, the Enter key and the idea chips.

function sendFromInput(src){

  if(!ta.value.trim()){if(src!=='enter')startVoice();return}   // empty: button = voice typing, Enter = nothing
  if(ctx.locked)return;                                          // a send is already being handed over
  if(ctx.s.gen&&!ctx.playing){toast('Still waiting for the reply…');return} // request in flight: keep the text, do not drop it
  ctx.locked=true;

    ctx.locked=false;

function clearRegen(ctx){const e=ctx.feedIn&&$('.m.regen',ctx.feedIn);if(e)e.remove()}
function renderRegen(ctx){
  clearRegen(ctx);if(ctx.gone||ctx.s.gen||!ctx.s.last)return;
  const m=ctx.s.msgs,last=m[m.length-1];if(!last||last.t==='user'||last.t==='err')return;
  ctx.feedIn.append(h(`<div class="m regen"><button class="chip" data-act="regen">${ic('retry',16)} Regenerate</button></div>`));
  if(ctx.atBottom)requestAnimationFrame(()=>toBottom(true));
}
function regenerate(){
  const ctx=cur;if(!ctx||ctx.gone||ctx.s.gen||!ctx.s.last)return;
  const L=ctx.s.last;restoreState(ctx.s,L.snap);
  ctx.atBottom=true;renderFeed(ctx);renderStrip();renderScene();toBottom(false);
  respond(ctx,L.text,L.target);
}
function respond(ctx,text,target){const p=runReply(ctx,text,target);ctx.busy=p;return p} // ctx.busy lets a following send wait for this reply
async function runReply(ctx,text,target){
  if(ctx.s.gen)return;                                   // never two requests at once
  ctx.s.gen=true;ctx.fast=false;ctx.playing=false;if(!ctx.gone)updateSend();
  $$('.m.err',ctx.feedIn).forEach(e=>e.remove());
  ctx.s.msgs=ctx.s.msgs.filter(m=>m.t!=='err');
  clearRegen(ctx);
  ctx.s.last={snap:snapState(ctx.s),text,target:target||null}; // lets "Regenerate" undo this reply
  showTyping(ctx,target||ctx.s.focus||ctx.s.present[0]);
  try{
    const out=await Engine.generate({w:ctx.w,s:ctx.s,text,target});
    hideTyping(ctx);
    ctx.playing=true;                                    // the reply is here; only the pacing animation is left
    await playBeats(ctx,out.beats);
    applyOut(ctx,out);
  }catch(e){
    console.error('StoryVerse reply failed:',e);
    hideTyping(ctx);
    addMsg(ctx,{t:'err',kind:e&&e.kind||'gen',hint:(e&&e.hint)||(e&&e.kind?'':'Something went wrong while showing the reply.')});
  }finally{
    ctx.playing=false;ctx.fast=false;ctx.s.gen=false;     // runs on success, failure and abort: the send button can never stay stuck
    try{
      if(!ctx.gone){updateSend();renderRegen(ctx)}
      else if(cur&&cur!==ctx&&!cur.gone&&cur.s===ctx.s){renderFeed(cur);renderStrip();renderScene();updateSend();renderRegen(cur)} // reply finished after the world was re-opened
    }catch(e){console.error(e)}
    Store.touch(ctx.s);
  }
}

/* ---------- global events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=t.dataset.id,v=t.dataset.v;
  switch(a){
    case 'tab':switchTab(t.dataset.tab);break;
    case 'open':showDetails(id);break;
    case 'enter':e.stopPropagation();enterWorld(id);break;
    case 'back':Layers.back();break;
    case 'sheetclose':Layers.back();break;
    case 'gosearch':switchTab('worlds');setTimeout(()=>$('#q')&&$('#q').focus(),80);break;
    case 'filter':UI.filter=v;if(UI.tab!=='worlds'){switchTab('worlds')}else{$$('#fchips .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===v));renderResults()}break;
    case 'view':UI.view=v;$$('.seg [data-act="view"]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));renderResults();break;
    case 'char':{const wid=t.dataset.w||(cur&&cur.w.id);if(Layers.top()&&Layers.top().tag==='sheet'){Layers.back();setTimeout(()=>charSheet(wid,id),320)}else charSheet(wid,id);break}
    case 'talk':Layers.back();setTimeout(()=>{setMention(id);$('#ta').focus()},320);break;
    case 'unmention':setMention(null);break;
    case 'menu':openMenu();break;
    case 'status':openStatus();break;
    case 'menuitem':{const k=t.dataset.k;if(k==='exit'){Layers.back();setTimeout(()=>Layers.back(),320)}else{menuItem(k)}break}
    case 'send':sendFromInput('button');break;
    case 'sugg':openSuggestions();break;
    case 'suggest':sendText(t.dataset.t);break;
    case 'bottom':cur.atBottom=true;toBottom(true);$('#pill').hidden=true;break;
    case 'earlier':{const f=cur.feed,old=f.scrollHeight;cur.showAll=true;renderFeed(cur);f.scrollTop=f.scrollHeight-old;break}
    case 'retry':if(cur.s.gen){toast('Still waiting for the reply…');break}respond(cur,cur.lastText||'',cur.lastTarget);break;
    case 'regen':regenerate();break;
    case 'restart':confirmSheet({title:'Start this world over?',body:'Your conversation, relationships and timeline for this world will be cleared. This cannot be undone.',ok:'Start over',danger:true,onOk:()=>{delete Store.data.states[id];Store.saveSoon();renderDetails(id);switchTab(UI.tab);toast('World reset')}});break;
    case 'fs':Store.data.settings.fs=v;Store.saveSoon();applySettings();renderProfile();break;
    case 'tog':{const k=t.dataset.k;Store.data.settings[k]=!Store.data.settings[k];Store.saveSoon();applySettings();renderProfile();break}
    case 'dev':devAction(v);break;
    case 'wizard':openWizard(t.dataset.i!=null?+t.dataset.i:null);break;
    case 'dgenre':draft.genre=v;$$('[data-act="dgenre"]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));break;
    case 'drel':draft.rel=+t.dataset.i;$$('[data-act="drel"]').forEach((b,i)=>b.classList.toggle('on',i===draft.rel));break;
    case 'dkind':draft.kind=v;$('#wbody').innerHTML=stepHtml();break;
    case 'dpal':draft.pal=v;$('#wbody').innerHTML=stepHtml();break;
    case 'cadd':{const n=$('#c-name').value.trim();if(!n){toast('Give the character a name first.');break}
      draft.chars.push({name:n,role:$('#c-role').value.trim(),traits:$('#c-traits').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,5),hue:(draft.chars.length*67+200)%360});
      $('#clist2').innerHTML=charListHtml();['c-name','c-role','c-traits'].forEach(i=>$('#'+i).value='');updateNext();break}
    case 'cdel':draft.chars.splice(+t.dataset.i,1);$('#clist2').innerHTML=charListHtml();updateNext();break;
    case 'wprev':step--;renderWizard();break;
    case 'wnext':if(valid())break;if(step<STEPS.length-1){step++;renderWizard();$('#s-wizard .scroll').scrollTop=0}else{
      const w=draftToWorld(draft);WORLDS.push(w);Store.saveSoon();Layers.back();
      setTimeout(()=>{toast('World created');switchTab('worlds');showDetails(w.id)},380)}break;
  }
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][tabindex]')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){UI.q=t.value;renderResults()}
  else if(t.id==='pname'){Store.data.player.name=t.value.trim()||'Player';Store.saveSoon()}
  else if(t.dataset.d){draft[t.dataset.d]=t.value;updateNext()}
  else if(t.id==='cq'){const q=t.value.toLowerCase();$$('#clist .row-c').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')}
});
function devAction(v){
  const st=Store.data.settings;
  if(v==='fail'){st.failNext=true;toast('The next reply will fail. Open a world and send a message.')}
  else if(v==='offline'){st.offline=!st.offline;renderProfile();toast(st.offline?'Offline mode on':'Back online')}
  else if(v==='reset'){confirmSheet({title:'Reset all progress?',body:'Every world returns to its starting point.',ok:'Reset everything',danger:true,onOk:()=>{Store.data.states={};WORLDS.filter(w=>w.custom).forEach(w=>WORLDS.splice(WORLDS.indexOf(w),1));Store.saveSoon();renderProfile();toast('All progress reset')}})}
  else if(v==='ping'){
    toast('Testing the AI connection…');
    fetch(API_URL+'?test=1').then(r=>r.json()).then(j=>toast(j.ok?'AI is working ('+j.model+')':(j.message||'AI test failed')))
      .catch(()=>toast(location.protocol==='file:'?'Open your Vercel link to test the AI.':'Could not reach /api/chat'));
  }
  else if(v==='stress'){
    const w=played()[0]||WORLDS[0];enterWorld(w.id);
    setTimeout(()=>stressTest(),w===played()[0]?1000:2600);
  }
}
addEventListener('online',()=>{const b=$('#banner');if(b)b.hidden=Store.data.settings.offline});
addEventListener('offline',()=>{const b=$('#banner');if(b)b.hidden=false});

/* ---------- init ---------- */
if(Store.load()){uid=Object.values(Store.data.states).reduce((m,st)=>st.msgs.reduce((a,x)=>Math.max(a,x.id||0),m),0)}else{seedStates();Store.saveSoon()}
applySettings();fit();switchTab('home');
</script>
</body>
</html>
